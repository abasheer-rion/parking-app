name: Deploy Worker

# Deploys the Cloudflare Worker in cloudflare/ when it changes on main.
# Needs CLOUDFLARE_API_TOKEN as a secret and CLOUDFLARE_ACCOUNT_ID as a variable in the "cloudflare" environment.
# Without the token it skips with a notice instead of failing.
# The token is set by platform/github/owner-set-secrets.sh in endyland-infra.
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check for the Cloudflare token
        id: token
        working-directory: .
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set in the cloudflare environment."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CF_ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID variable is not set in the cloudflare environment."
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install
        if: steps.token.outputs.ok == 'true'
        run: npm ci --include=dev --no-fund --no-audit

      - name: Typecheck
        if: steps.token.outputs.ok == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.token.outputs.ok == 'true'
        run: npm test

      - name: Apply database changes
        if: steps.token.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply parking-app --remote

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
