name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      # No browser download: the tests never launch Playwright.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m py_compile *.py
      - run: pytest -q tests
        env:
          WORKER: mock

  worker:
    # The Cloudflare Worker port in cloudflare/. Tests run in workerd with a local D1 and a fake
    # browser, so they never reach the property's site or send email.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --include=dev
      - run: npx tsc --noEmit
      - run: npx vitest run
