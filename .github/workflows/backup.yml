name: Nightly D1 backup

# Exports the parking-app D1 database every night and keeps it as a private artifact for 30 days.
# Needs CLOUDFLARE_API_TOKEN as a secret in the "cloudflare" environment (Account, D1, Edit: export needs it).
# Without it the job skips with a notice. Restore steps: cloudflare/README.md.

on:
  schedule:
    - cron: "15 8 * * *"   # 08:15 UTC, 3:15 AM in Austin (2:15 AM in winter)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ba15337853352a33fd60d311715146c1
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check for the Cloudflare token
        id: check
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Backup skipped::CLOUDFLARE_API_TOKEN is not set in the cloudflare environment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - if: steps.check.outputs.skip != 'true'
        run: npm ci --include=dev
      - name: Export D1
        if: steps.check.outputs.skip != 'true'
        id: export
        run: |
          stamp="$(date -u +%Y-%m-%dT%H%MZ)"
          mkdir -p backup
          npx wrangler d1 export parking-app --remote --output "backup/parking-app-$stamp.sql"
          gzip -9 "backup/parking-app-$stamp.sql"
          ls -l backup
          echo "name=parking-app-d1-$stamp" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.export.outputs.name }}
          path: cloudflare/backup/*.sql.gz
          retention-days: 30
          if-no-files-found: error
